<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户端消息</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; margin: 0; background: #f5f6fa; display: flex; flex-direction: column; height: 100vh; }
        header { background: #389e0d; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        h1 { margin: 0; font-size: 18px; }
        #status { font-size: 13px; padding: 3px 12px; border-radius: 12px; background: rgba(255,255,255,.2); }
        #display { flex: 1; margin: 12px 16px 0; padding: 12px; border: 1px solid #d9d9d9; border-radius: 6px; resize: none; font-size: 14px; line-height: 1.7; background: #fff; outline: none; }
        .input-bar { display: flex; gap: 8px; margin: 12px 16px 16px; flex-shrink: 0; }
        #input { flex: 1; height: 78px; padding: 10px; border: 1px solid #d9d9d9; border-radius: 6px; resize: none; font-size: 14px; outline: none; }
        #send { width: 90px; flex-shrink: 0; border: none; border-radius: 6px; color: #fff; font-size: 15px; cursor: pointer; background: #389e0d; }
        #send:hover { opacity: .85; }
        #send:disabled { opacity: .4; cursor: not-allowed; }
    </style>
</head>
<body>
<header>
    <h1>客户端消息</h1>
    <div id="status">未连接</div>
</header>
<textarea id="display" readonly placeholder="消息显示区域，聊天记录将显示在这里…"></textarea>
<div class="input-bar">
    <textarea id="input" placeholder="输入消息，点击发送或按 Enter 发送…"></textarea>
    <button id="send">发送</button>
</div>
<script>
    const status = document.getElementById('status');
    const display = document.getElementById('display');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const ws = new WebSocket('ws://' + location.host + '/ws?channel=client');

    ws.onopen = () => { status.textContent = '已连接'; send.disabled = false; };
    ws.onclose = () => { status.textContent = '连接已断开'; send.disabled = true; };
    ws.onmessage = (e) => {
        display.value += e.data + '\n';
        display.scrollTop = display.scrollHeight;
    };

    function sendMessage() {
        if (ws.readyState !== WebSocket.OPEN) {
            alert('连接未建立，请稍后再试');
            return;
        }
        const text = input.value.trim();
        if (!text) return;
        ws.send(text);
        input.value = '';
        input.focus();
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
